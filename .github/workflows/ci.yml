name: CI

on:
  pull_request:

# main への push は deploy.yml が typecheck と build を通してからデプロイするので、
# ここでは PR だけを見る。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
